# Navigation parameters for nav_detect_grasp demo

# Target area position (relative to robot base)
target_area_pose:
  x: 1.0      # Forward 1 meter
  y: 0.0      # Center
  z: 0.74     # COM height
  yaw: 0.0    # Orientation

# Place area position
place_area_pose:
  x: 2.0      # Forward 2 meters
  y: 0.5      # Left 0.5 meters
  z: 0.74     # COM height
  yaw: 45.0   # 45 degrees orientation

# Navigation control parameters
navigation:
  approach_distance: 0.3        # Distance to approach target
  max_linear_velocity: 0.2      # Maximum linear velocity (m/s)
  max_angular_velocity: 0.5     # Maximum angular velocity (rad/s)
  position_tolerance: 0.05      # Position tolerance (m)
  orientation_tolerance: 0.1    # Orientation tolerance (rad)
  timeout: 30.0                 # Navigation timeout (s)

# Robot movement parameters
movement:
  step_duration: 2.0            # Duration for each step (s)
  step_height: 0.05             # Step height (m)
  stance_width: 0.2             # Stance width (m) 