# Detection parameters for nav_detect_grasp demo

# AprilTag detection parameters
apriltag:
  marker_id: 0                   # Target AprilTag ID
  marker_size: 0.05              # Marker size (m)
  detection_timeout: 10.0        # Detection timeout (s)
  min_detection_confidence: 0.8  # Minimum detection confidence
  max_detection_distance: 2.0    # Maximum detection distance (m)

# YOLO detection parameters
yolo:
  model_path: "yolov8n.pt"       # YOLO model file
  confidence_threshold: 0.5      # Detection confidence threshold
  nms_threshold: 0.4             # Non-maximum suppression threshold
  target_classes: ["cup", "bottle", "book", "box"]  # Target object classes
  detection_timeout: 5.0         # Detection timeout (s)

# Camera parameters
camera:
  # Gemini-335L相机话题（默认，官方标配）
  image_topic: "/camera/image_raw"
  depth_topic: "/camera/depth/image_raw"
  camera_info_topic: "/camera/camera_info"
  frame_id: "camera_link"
  
  # RealSense相机话题（可选）
  # image_topic: "/camera/color/image_raw"
  # depth_topic: "/camera/depth/image_rect_raw"
  # camera_info_topic: "/camera/color/camera_info"
  # frame_id: "head_camera_color_optical_frame"
  
  # ZED相机话题（可选）
  # image_topic: "/zed/left/image_rect_color"
  # depth_topic: "/zed/depth/depth_registered"
  # camera_info_topic: "/zed/left/camera_info"
  # frame_id: "zed_left_camera_optical_frame"

# Object pose estimation parameters
pose_estimation:
  depth_sample_size: 5           # Number of depth samples for pose estimation
  min_depth: 0.1                 # Minimum depth (m)
  max_depth: 3.0                 # Maximum depth (m)
  pose_filter_window: 10         # Pose filtering window size
  position_noise_threshold: 0.05 # Position noise threshold (m)
  orientation_noise_threshold: 0.1 # Orientation noise threshold (rad) 